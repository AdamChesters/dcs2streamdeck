<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dcs2streamdeck mirror</title>
<style>
	/* Transparent page: OpenKneeboard shows only the deck, as a glass panel with no knobs. */
	html, body { margin: 0; background: transparent; overflow: hidden; }
	body { padding: 14px; font-family: "Segoe UI", Arial, sans-serif; color: #fff; }
	.deck {
		display: inline-flex; flex-direction: column; gap: 18px; padding: 24px; border-radius: 30px;
		background: linear-gradient(160deg, rgba(235, 242, 250, 0.38), rgba(210, 222, 236, 0.16) 35%, rgba(190, 205, 222, 0.12) 65%, rgba(235, 242, 250, 0.26));
		border: 1.5px solid rgba(255, 255, 255, 0.5);
		box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 40px rgba(255, 255, 255, 0.1), 0 14px 40px rgba(0, 0, 0, 0.3);
		backdrop-filter: blur(18px) saturate(1.2);
		transform-origin: top left;
	}
	.keys { display: grid; gap: 18px; }
	.key {
		position: relative; width: 144px; height: 144px; border-radius: 16px; background: rgba(4, 6, 10, 0.7);
		box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.22), 0 0 14px rgba(150, 200, 255, 0.12), 0 6px 14px rgba(0, 0, 0, 0.5);
	}
	/* Glossy top half, like a lit glass key. */
	.key::after { content: ""; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 45%); pointer-events: none; }
	.key img { width: 100%; height: 100%; display: block; border-radius: 16px; }
	/* One touch strip under the keys, split per dial. */
	.dials {
		display: grid; border-radius: 14px; overflow: hidden; background: rgba(4, 8, 14, 0.85);
		box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 14px rgba(0, 0, 0, 0.4);
	}
	.dial { box-sizing: border-box; height: 92px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
	.dial + .dial { border-left: 1px solid rgba(255, 255, 255, 0.12); }
	.dial .t { font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; color: #cdd7e2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.dial .v { font-size: 22px; font-weight: 600; text-shadow: 0 0 8px rgba(150, 200, 255, 0.35); }
	.dial.dead .v { color: #7b8590; font-size: 18px; }
	.bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
	.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2f8cff, #dff1ff); box-shadow: 0 0 10px rgba(120, 190, 255, 0.8); }
	.dots { display: flex; gap: 4px; height: 6px; }
	.dots b { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); }
	.dots b.on { background: #fff; }
	/* Stream Deck Neo: its info bar between the two touch points. Mirror only: the plugin cannot draw on the real bar. */
	.neo { display: grid; gap: 18px; align-items: center; }
	.touch { height: 10px; margin: 0 24px; border-radius: 5px; background: rgba(255, 255, 255, 0.18); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); }
	.infobar {
		position: relative; box-sizing: border-box; height: 80px; padding: 0 18px; border-radius: 14px; min-width: 0;
		display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(4, 8, 14, 0.85);
		box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 14px rgba(0, 0, 0, 0.4);
	}
	.infobar .text { font-size: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 8px rgba(150, 200, 255, 0.35); }
	.infobar.dead .text { color: #7b8590; text-shadow: none; }
	.infobar .time { font-size: 24px; color: #cdd7e2; }
	.infobar .tag { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(205, 215, 226, 0.55); }
	.wait {
		padding: 12px 18px; font-size: 18px; display: inline-block; border-radius: 14px;
		background: rgba(10, 14, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(12px);
	}
</style>
</head>
<body>
<div id="root"><div class="wait">Waiting for Stream Deck plugin…</div></div>
<script>
	// Optional: ?device=<id> picks a deck when several are connected.
	const want = new URLSearchParams(location.search).get("device");
	const root = document.getElementById("root");

	function el(tag, cls, children = []) {
		const e = document.createElement(tag);
		if (cls) e.className = cls;
		e.append(...children);
		return e;
	}

	// Unlit keys a shade darker than on the deck itself, for the glass-panel look.
	const glass = (svg) => svg.replace(/^(<svg[^>]*><rect [^>]*?fill=")#(?:2a2a2a|161616)"/, "$1#0c0e12\"");

	const clock = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

	function render({ devices, tiles, bar }) {
		const device = devices.find((d) => d.id === want) || devices.find((d) => d.dials) || devices[0];
		const id = device?.id ?? tiles[0]?.device;
		const mine = tiles.filter((t) => t.device === id);
		const columns = device?.columns ?? 4;
		const rows = device?.rows ?? 2;
		// One strip segment per dial: 4 on the Stream Deck +, 6 on the + XL (fewer than its 9 columns).
		const dialCount = device?.dials ?? (mine.some((t) => t.kind === "dial") ? 4 : 0);

		const keys = el("div", "keys");
		keys.style.gridTemplateColumns = `repeat(${columns}, 144px)`;
		for (let row = 0; row < rows; row++) {
			for (let column = 0; column < columns; column++) {
				const tile = mine.find((t) => t.kind === "key" && t.row === row && t.column === column);
				const key = el("div", "key");
				if (tile) {
					const img = new Image();
					img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(glass(tile.svg));
					key.append(img);
				}
				keys.append(key);
			}
		}
		const parts = [keys];

		if (dialCount) {
			const dials = el("div", "dials");
			dials.style.gridTemplateColumns = `repeat(${dialCount}, 1fr)`;
			for (let column = 0; column < dialCount; column++) {
				const tile = mine.find((t) => t.kind === "dial" && t.column === column);
				if (!tile) {
					dials.append(el("div", "dial empty"));
					continue;
				}
				const d = tile.dial;
				const t = el("div", "t");
				t.textContent = d.title;
				const v = el("div", "v");
				v.textContent = d.value;
				const fill = el("i");
				fill.style.width = `${Math.max(0, Math.min(100, d.percent))}%`;
				const dots = el("div", "dots", d.functions.length > 1 ? d.functions.map((_, i) => el("b", i === d.index ? "on" : "")) : []);
				dials.append(el("div", d.live ? "dial" : "dial dead", [t, v, el("div", "bar", [fill]), dots]));
			}
			parts.push(dials);
		}

		if (device?.infoBar) {
			const tag = el("div", "tag");
			tag.textContent = "Experimental";
			const text = el("div", "text");
			text.textContent = bar.text;
			const time = el("div", "time");
			time.textContent = clock();
			const info = el("div", bar.live ? "infobar" : "infobar dead", [tag, text, time]);
			info.style.gridColumn = `span ${Math.max(1, columns - 2)}`;
			const neo = el("div", "neo", [el("div", "touch"), info, el("div", "touch")]);
			neo.style.gridTemplateColumns = `repeat(${columns}, 144px)`;
			parts.push(neo);
		}
		root.replaceChildren(el("div", "deck", parts));
		fit();
	}

	// A deck bigger than the page (XL, + XL) shrinks to fit instead of being cut off; never grows.
	function fit() {
		const deck = root.querySelector(".deck");
		if (!deck) return;
		const scale = Math.min(1, (innerWidth - 28) / deck.offsetWidth, (innerHeight - 28) / deck.offsetHeight);
		deck.style.transform = scale < 1 ? `scale(${scale})` : "";
	}
	addEventListener("resize", fit);
	setInterval(() => {
		const time = root.querySelector(".infobar .time");
		if (time) time.textContent = clock();
	}, 10000);

	const events = new EventSource("/events");
	events.onmessage = (msg) => render(JSON.parse(msg.data));
	events.onerror = () => root.replaceChildren(Object.assign(el("div", "wait"), { textContent: "Stream Deck plugin not running" }));
</script>
</body>
</html>
