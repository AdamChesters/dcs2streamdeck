<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>DCS Light</title>
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<label for="lamp">Light or indicator</label>
	<input type="search" id="lampSearch" placeholder="Type to search (e.g. caution, l bar, aoa, flaps, gear)" />
	<select id="lamp" data-setting="lamp"></select>
	<div class="hint">Matches appear in the list as you type; click one, or press Enter for the top match. A light with several colours or parts (AOA indexer, landing gear) shows all of it on this key.</div>

	<label for="title">Key text</label>
	<input type="text" id="title" data-setting="title" placeholder="Empty = light name" />

	<div class="row"><input type="checkbox" id="invert" data-setting="invert" /><label for="invert" style="margin:0">Light when OFF</label></div>
	<script src="pi.js"></script>
	<script>
		picker(document.getElementById("lamp"), document.getElementById("lampSearch"), (i) => i.led);
	</script>
</body>
</html>
